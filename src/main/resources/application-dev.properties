# Banco local em memória: os dados são descartados ao encerrar a aplicação.
spring.datasource.url=jdbc:h2:mem:agendamedico;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Console disponível em http://localhost:8080/h2-console durante o desenvolvimento.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
