<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Minha agenda</h1>
            <p class="text-muted mb-0">Defina seus períodos de atendimento.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/medico/painel}">Painel</a>
            <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sair</button></form>
        </div>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Adicionar período</h2>
            <form th:action="@{/medico/agenda}" th:object="${horario}" method="post">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p class="mb-0" th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
                </div>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label" for="data">Data</label>
                        <input class="form-control" th:field="*{data}" id="data" type="date" required>
                        <div class="small text-danger" th:errors="*{data}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="horaInicio">Início</label>
                        <input class="form-control" th:field="*{horaInicio}" id="horaInicio" type="time" required>
                        <div class="small text-danger" th:errors="*{horaInicio}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="horaFim">Fim</label>
                        <input class="form-control" th:field="*{horaFim}" id="horaFim" type="time" required>
                        <div class="small text-danger" th:errors="*{horaFim}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="duracaoConsulta">Duração (min.)</label>
                        <input class="form-control" th:field="*{duracaoConsulta}" id="duracaoConsulta" type="number" min="1" required>
                        <div class="small text-danger" th:errors="*{duracaoConsulta}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="valorConsulta">Valor (R$)</label>
                        <input class="form-control" th:field="*{valorConsulta}" id="valorConsulta" type="number" min="0" step="0.01" required>
                        <div class="small text-danger" th:errors="*{valorConsulta}"></div>
                    </div>
                </div>
                <button class="btn btn-primary mt-3" type="submit">Adicionar horário</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/medico/agenda}">
                <div class="col-sm-4">
                    <label class="form-label" for="filtroData">Visualizar data</label>
                    <input class="form-control" id="filtroData" name="data" type="date" th:value="${dataSelecionada}" required>
                </div>
                <div class="col-sm-2"><button class="btn btn-outline-primary" type="submit">Filtrar</button></div>
            </form>
            <h2 class="h5">Períodos em <span th:text="${#temporals.format(dataSelecionada, 'dd/MM/yyyy')}"></span></h2>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Início</th><th>Fim</th><th>Ação</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${horarios}">
                        <td th:text="${#temporals.format(item.horaInicio, 'HH:mm')}"></td>
                        <td th:text="${#temporals.format(item.horaFim, 'HH:mm')}"></td>
                        <td>
                            <form th:action="@{/medico/agenda/excluir}" method="post">
                                <input name="id" type="hidden" th:value="${item.id}">
                                <input name="data" type="hidden" th:value="${dataSelecionada}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Remover</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(horarios)}"><td colspan="3" class="text-muted">Nenhum período cadastrado nesta data.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
