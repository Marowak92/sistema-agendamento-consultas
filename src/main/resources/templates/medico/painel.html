<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel do Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 1000px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0">Painel do dia</h1>
            <p class="text-muted mb-0">Acompanhe sua agenda e previsões.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/medico/agenda}">Minha agenda</a>
            <a class="btn btn-outline-primary" th:href="@{/medico/consultas}">Consultas</a>
            <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sair</button></form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form class="row g-2 align-items-end" method="get" th:action="@{/medico/painel}">
                <div class="col-sm-4">
                    <label class="form-label" for="data">Data</label>
                    <input class="form-control" id="data" name="data" type="date" th:value="${painel.data}" required>
                </div>
                <div class="col-sm-2"><button class="btn btn-primary" type="submit">Consultar</button></div>
            </form>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body"><div class="text-muted small">Data</div><strong th:text="${#temporals.format(painel.data, 'dd/MM/yyyy')}"></strong></div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body"><div class="text-muted small">Consultas</div><strong th:text="${painel.totalConsultas}"></strong></div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body"><div class="text-muted small">Horas previstas</div><strong th:text="${painel.horasPrevistasFormatadas}"></strong></div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card shadow-sm h-100"><div class="card-body"><div class="text-muted small">Valor previsto</div><strong>R$ <span th:text="${#numbers.formatDecimal(painel.valorPrevisto, 1, 2)}"></span></strong></div></div></div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <h2 class="h5 mb-3">Agenda</h2>
            <table class="table align-middle mb-0">
                <thead><tr><th>Horário</th><th>Situação</th></tr></thead>
                <tbody>
                <tr th:each="linha : ${painel.agenda}">
                    <td th:text="${#temporals.format(linha.horario, 'HH:mm')}"></td>
                    <td>
                        <span class="text-success" th:if="${linha.livre}">Livre</span>
                        <span th:unless="${linha.livre}">
                            <span th:text="${linha.consulta.paciente.nome}"></span> - Agendada
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(painel.agenda)}"><td colspan="2" class="text-muted">Não há período de atendimento cadastrado para esta data.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
