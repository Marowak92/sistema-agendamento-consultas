<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Agendamento de Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 text-center mb-4">Agendamento de Consultas</h1>

            <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos.</div>
            <div th:if="${param.logout}" class="alert alert-success">Você saiu do sistema.</div>
            <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">E-mail</label>
                    <input class="form-control" id="username" name="username" type="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Senha</label>
                    <input class="form-control" id="password" name="password" type="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>

            <p class="text-center mt-3 mb-0">Ainda não possui cadastro? <a th:href="@{/cadastro}">Cadastre-se</a>.</p>
        </div>
    </div>
</main>
</body>
</html>
