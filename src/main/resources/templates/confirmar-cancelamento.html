<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar cancelamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 620px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3">Cancelar consulta</h1>
            <p>Deseja realmente cancelar esta consulta?</p>
            <dl class="row mb-4">
                <dt class="col-sm-4">Paciente</dt><dd class="col-sm-8" th:text="${consulta.paciente.nome}"></dd>
                <dt class="col-sm-4">Médico</dt><dd class="col-sm-8" th:text="${consulta.medico.nome}"></dd>
                <dt class="col-sm-4">Data</dt><dd class="col-sm-8" th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy')}"></dd>
                <dt class="col-sm-4">Horário</dt><dd class="col-sm-8" th:text="${#temporals.format(consulta.horario, 'HH:mm')}"></dd>
            </dl>
            <form class="d-inline" th:action="${acao}" method="post">
                <button class="btn btn-danger" type="submit">Sim, cancelar consulta</button>
            </form>
            <a class="btn btn-outline-secondary" th:href="${voltar}">Não, voltar</a>
        </div>
    </div>
</main>
</body>
</html>
