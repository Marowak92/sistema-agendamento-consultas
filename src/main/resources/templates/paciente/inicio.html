<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Área do Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Área do Paciente</h1>
        <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sair</button></form>
    </div>
    <div class="card">
        <div class="card-body">
            <p>Escolha um médico, veja os horários disponíveis e agende sua consulta.</p>
            <a class="btn btn-primary" th:href="@{/paciente/medicos}">Agendar consulta</a>
            <a class="btn btn-outline-primary" th:href="@{/paciente/minhas-consultas}">Minhas consultas</a>
        </div>
    </div>
</main>
</body>
</html>
