<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda do médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 850px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="${medico.nome}"></h1>
            <p class="text-muted mb-0" th:text="${medico.especialidade}"></p>
        </div>
        <a class="btn btn-outline-primary" th:href="@{/paciente/medicos}">Voltar aos médicos</a>
    </div>

    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form class="row g-2 align-items-end" method="get" th:action="@{/paciente/agenda-medico}">
                <input name="medicoId" type="hidden" th:value="${medico.id}">
                <div class="col-sm-5">
                    <label class="form-label" for="data">Escolha a data</label>
                    <input class="form-control" id="data" name="data" type="date" th:value="${dataSelecionada}" required>
                </div>
                <div class="col-sm-2"><button class="btn btn-outline-primary" type="submit">Ver horários</button></div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="h5">Horários livres em <span th:text="${#temporals.format(dataSelecionada, 'dd/MM/yyyy')}"></span></h2>
            <div class="d-flex flex-wrap gap-2" th:if="${!#lists.isEmpty(horarios)}">
                <a class="btn btn-outline-primary" th:each="horario : ${horarios}"
                   th:href="@{/paciente/resumo-consulta(medicoId=${medico.id}, data=${dataSelecionada}, horario=${horario})}"
                   th:text="${#temporals.format(horario, 'HH:mm')}"></a>
            </div>
            <p class="text-muted mb-0" th:if="${#lists.isEmpty(horarios)}">Não há horários livres para esta data.</p>
        </div>
    </div>
</main>
</body>
</html>
