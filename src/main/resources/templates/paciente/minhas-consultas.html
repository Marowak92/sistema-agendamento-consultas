<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 950px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Minhas consultas agendadas</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/paciente/medicos}">Agendar consulta</a>
            <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sair</button></form>
        </div>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Data</th><th>Horário</th><th>Médico</th><th>Especialidade</th><th>Ação</th></tr></thead>
                <tbody>
                <tr th:each="consulta : ${consultas}">
                    <td th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(consulta.horario, 'HH:mm')}"></td>
                    <td th:text="${consulta.medico.nome}"></td>
                    <td th:text="${consulta.medico.especialidade}"></td>
                    <td><a class="btn btn-sm btn-outline-danger" th:href="@{/paciente/consultas/{id}/cancelar(id=${consulta.id})}">Cancelar</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(consultas)}"><td colspan="5" class="text-muted">Você não possui consultas agendadas.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
