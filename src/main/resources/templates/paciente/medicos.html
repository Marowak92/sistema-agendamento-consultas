<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Médicos disponíveis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="h3 mb-0">Escolha um médico</h1></div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/paciente/inicio}">Início</a>
            <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sair</button></form>
        </div>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/paciente/medicos}">
        <div class="col-sm-8">
            <label class="form-label" for="busca">Buscar por nome ou especialidade</label>
            <input class="form-control" id="busca" name="busca" type="search" th:value="${busca}"
                   placeholder="Ex.: Cardiologista ou Ana">
        </div>
        <div class="col-sm-4 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Buscar</button>
            <a class="btn btn-outline-secondary" th:href="@{/paciente/medicos}">Limpar</a>
        </div>
    </form>

    <p class="text-muted" th:if="${#lists.isEmpty(medicos)}">Nenhum médico encontrado para esta busca.</p>

    <div class="row g-3">
        <div class="col-md-4" th:each="medico : ${medicos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5" th:text="${medico.nome}"></h2>
                    <p class="text-muted" th:text="${medico.especialidade}"></p>
                    <a class="btn btn-primary mt-auto" th:href="@{/paciente/agenda-medico(medicoId=${medico.id})}">Ver agenda</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
