<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 620px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-4">Resumo da consulta</h1>
            <dl class="row mb-4">
                <dt class="col-sm-4">Médico</dt><dd class="col-sm-8" th:text="${consulta.medico.nome}"></dd>
                <dt class="col-sm-4">Especialidade</dt><dd class="col-sm-8" th:text="${consulta.medico.especialidade}"></dd>
                <dt class="col-sm-4">Data</dt><dd class="col-sm-8" th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy')}"></dd>
                <dt class="col-sm-4">Horário</dt><dd class="col-sm-8" th:text="${#temporals.format(consulta.horario, 'HH:mm')}"></dd>
                <dt class="col-sm-4">Duração</dt><dd class="col-sm-8"><span th:text="${consulta.duracao}"></span> minutos</dd>
                <dt class="col-sm-4">Valor</dt><dd class="col-sm-8">R$ <span th:text="${#numbers.formatDecimal(consulta.valor, 1, 2)}"></span></dd>
            </dl>
            <form th:action="@{/paciente/consultas}" th:object="${agendamento}" method="post">
                <input th:field="*{medicoId}" type="hidden">
                <input th:field="*{data}" type="hidden">
                <input th:field="*{horario}" type="hidden">
                <button class="btn btn-primary" type="submit">Confirmar agendamento</button>
                <a class="btn btn-outline-secondary" th:href="@{/paciente/agenda-medico(medicoId=${consulta.medico.id}, data=${consulta.data})}">Voltar</a>
            </form>
        </div>
    </div>
</main>
</body>
</html>
